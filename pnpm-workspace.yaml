packages:
  - packages/*
  # The website, private so the release skips it.
  - docs

allowBuilds:
  # esbuild's binary comes from its platform package; the postinstall only checks it.
  esbuild: false
  # automd only needs @parcel/watcher for --watch, which the scripts don't use.
  "@parcel/watcher": false
  workerd: true

# The Nuxt 5 nightly, which the website uses, came out within a day of the move to it.
minimumReleaseAgeExclude:
  - "@nuxt/kit-nightly@5.0.0-2611010234-c709ec8"
  - "@nuxt/nitro-server-nightly@5.0.0-2611010234-c709ec8"
  - "@nuxt/schema-nightly@5.0.0-2611010234-c709ec8"
  - "@nuxt/vite-builder-nightly@5.0.0-2611010234-c709ec8"
  - "@nuxt/vite-server-nightly@5.0.0-2611010234-c709ec8"
  - nuxt-nightly@5.0.0-2611010234-c709ec8
